# Sadece PostgreSQL (yerel geliştirme — backend/frontend IDE'den çalışır)
name: idv-bursiyer-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: idv-bursiyer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idv_bursiyer}
      POSTGRES_USER: ${POSTGRES_USER:-idv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idv_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - idv_bursiyer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idv} -d ${POSTGRES_DB:-idv_bursiyer}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  idv_bursiyer_pg_data:
