name: idv-bursiyer-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: idv-bursiyer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idv_bursiyer}
      POSTGRES_USER: ${POSTGRES_USER:-idv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - idv_bursiyer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idv} -d ${POSTGRES_DB:-idv_bursiyer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    container_name: idv-bursiyer-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - idv_keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: idv-bursiyer-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/idv-bursiyer-realm.json:/opt/keycloak/data/import/idv-bursiyer-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: idv-bursiyer-backend:latest
    container_name: idv-bursiyer-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-idv_bursiyer}
      DB_USER: ${POSTGRES_USER:-idv}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/idv-bursiyer
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/idv-bursiyer/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      APP_STORAGE_UPLOAD_DIR: /app/uploads
    volumes:
      - /opt/idv-bursiyer/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_ENABLED: "true"
    image: idv-bursiyer-frontend:latest
    container_name: idv-bursiyer-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9080}:80"
    depends_on:
      - backend

volumes:
  idv_bursiyer_pg_data:
  idv_keycloak_pg_data:
