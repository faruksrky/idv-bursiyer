spring:
  application:
    name: idv-bursiyer-takip
  datasource:
    url: jdbc:postgresql://localhost:5432/idv_bursiyer
    username: idv
    password: idv_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Istanbul
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081
  error:
    include-message: always

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://burs.istanbuldostlukvakfi.org
  security:
    keycloak-enabled: false
  keycloak:
    server-url: http://localhost:8082
    realm: idv-bursiyer
    client-id: idv-bursiyer-frontend
  scholarship:
    monthly-amount: 3000
  evaluation:
    interview-pass-threshold: 80
    committee-member-count: 5
    family-income-interview-max: 100000
  storage:
    upload-dir: ./uploads
